.75rem", "full": "9999px" }, "spacing": { "margin-mobile": "1rem", "margin": "2rem", "space-md": "1rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "gutter-mobile": "0.75rem", "space-lg": "1.5rem", "space-xl": "2.5rem", "gutter": "1.5rem" }, "fontFamily": { "headline-md": [ "Space Grotesk" ], "headline-lg-mobile": [ "Space Grotesk" ], "body-md": [ "Plus Jakarta Sans" ], "headline-sm": [ "Space Grotesk" ], "headline-xl-mobile": [ "Space Grotesk" ], "headline-lg": [ "Space Grotesk" ], "label-code": [ "JetBrains Mono" ], "body-lg": [ "Plus Jakarta Sans" ], "label-badge": [ "JetBrains Mono" ], "headline-xl": [ "Space Grotesk" ], "body-sm": [ "Plus Jakarta Sans" ] }, "fontSize": { "headline-md": [ "22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "headline-lg-mobile": [ "24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "body-md": [ "14px", { "lineHeight": "20px", "fontWeight": "400" } ], "headline-sm": [ "18px", { "lineHeight": "24px", "fontWeight": "600" } ], "headline-xl-mobile": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" } ], "headline-lg": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" } ], "label-code": [ "13px", { "lineHeight": "18px", "fontWeight": "500" } ], "body-lg": [ "16px", { "lineHeight": "24px", "fontWeight": "400" } ], "label-badge": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.06em", "fontWeight": "600" } ], "headline-xl": [ "48px", { "lineHeight": "56px", "letterSpacing": "-0.03em", "fontWeight": "700" } ], "body-sm": [ "12px", { "lineHeight": "16px", "fontWeight": "400" } ] } } } }</script></head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-gutter"><main class="w-full max-w-md mx-auto"><div class="flex flex-col w-full items-center justify-center relative py-6">
<!-- Glowing Ambient Atmospheric Halos -->
<div class="absolute -top-12 -left-10 w-72 h-72 bg-primary/20 rounded-full blur-[88px] pointer-events-none"></div>
<div class="absolute -bottom-16 -right-10 w-80 h-80 bg-secondary/15 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-tertiary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Main Login Card Container -->
<div class="relative w-full max-w-md bg-surface-container-low/95 backdrop-blur-2xl rounded-xl shadow-2xl p-8 space-y-7 overflow-hidden">
<!-- Top Highlight Accent Glow -->
<div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-primary/40 to-transparent"></div>
<!-- Brand Header & Logo Lockup -->
<div class="flex flex-col items-center text-center space-y-4">
<div class="relative group">
<div class="absolute -inset-1 rounded-full bg-gradient-to-r from-secondary via-primary to-tertiary-container opacity-60 blur-md group-hover:opacity-90 transition duration-500"></div>
<div class="relative w-16 h-16 rounded-full bg-surface-container flex items-center justify-center shadow-lg">
<img alt="Promptify Script Logo" class="w-12 h-12 object-contain rounded-full" src="https://lh3.googleusercontent.com/aida/AEtjO1UOVKFBLRAg2GOHFmxvLsb47vsEsWLLxCh-Y8LlMbV6TzqMSY35Qx5pzKsgcrTLHq9u4MlVfrLwLgYT1sFnPb4IFpdszxvvvQ1lak26WRoovyoZlyTKAm3AQWzEu40kp4jv92cGh7tra_ApSNtMZi7N0ms2gEJd9n8zqWmB7vkPR_Xnz7uGH-7e0cjXDtI0hUVHv9WXsz8dx-TI4MTuOVgMs2ONzHTjUrzOiiMAXqIW0g"/>
</div>
</div>
<div class="space-y-1">
<div class="flex items-center justify-center gap-2">
<span class="font-headline-md text-headline-md tracking-tight text-on-surface">Promptify Script</span>
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-surface-container-highest text-secondary text-label-badge font-label-badge">
<span class="text-xs text-secondary"></span> PRO
          </span>
</div>
<h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold pt-1">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to access your prompt generator.</p>
</div>
</div>
<!-- Login Form -->
<form class="space-y-5" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Email Address Field -->
<div class="space-y-1.5">
<label class="block font-label-code text-label-code text-on-surface-variant font-medium" for="email">Creator ID / Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full bg-surface-container text-on-surface placeholder:text-outline-variant font-body-md text-body-md pl-11 pr-4 py-3 rounded-lg outline-none transition duration-200 focus:bg-surface-container-high focus:shadow-[0_0_16px_rgba(128,131,255,0.25)]" id="email" placeholder="creator@promptify.ai" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block font-label-code text-label-code text-on-surface-variant font-medium" for="password">Master Key</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full bg-surface-container text-on-surface placeholder:text-outline-variant font-body-md text-body-md pl-11 pr-11 py-3 rounded-lg outline-none transition duration-200 focus:bg-surface-container-high focus:shadow-[0_0_16px_rgba(128,131,255,0.25)]" id="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface transition-colors p-1 flex items-center justify-center rounded" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot Options -->
<div class="flex items-center justify-between font-body-sm text-body-sm pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<input class="sr-only peer" id="rememberMe" type="checkbox"/>
<div class="w-4 h-4 rounded bg-surface-container peer-checked:bg-primary-container flex items-center justify-center transition shadow-sm group-hover:bg-surface-container-high">
<span class="material-symbols-outlined text-on-primary-container text-[14px] font-bold opacity-0 peer-checked:opacity-100">check</span>
</div>
<span class="text-on-surface-variant group-hover:text-on-surface transition">Remember me</span>
</label>
<a class="text-secondary hover:text-secondary-fixed transition font-medium" href="#forgot">Forgot password?</a>
</div>
<!-- Primary Action CTA -->
<button class="w-full relative group overflow-hidden py-3 px-5 rounded-lg bg-gradient-to-r from-primary-container via-primary-container to-secondary-container text-on-primary font-headline-sm text-headline-sm text-center font-semibold shadow-[0_4px_20px_rgba(128,131,255,0.35)] hover:shadow-[0_6px_24px_rgba(76,215,246,0.4)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" id="submitBtn" type="submit">
<span class="relative z-10 font-headline-sm text-headline-sm font-semibold tracking-wide">Sign In</span>
<span class="material-symbols-outlined relative z-10 text-[20px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</form>
<!-- Visual Separator Line -->
<div class="relative flex items-center justify-center">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute bg-surface-container-low px-3 font-label-badge text-label-badge uppercase tracking-wider text-outline">or authenticate with</span>
</div>
<!-- Quick OAuth Action -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface transition duration-200 active:scale-[0.99] group shadow-sm" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z" fill="#EA4335"></path>
<path d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z" fill="#4285F4"></path>
<path d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z" fill="#FBBC05"></path>
<path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z" fill="#34A853"></path>
</svg>
<span class="font-body-md text-body-md font-medium text-on-surface group-hover:text-primary transition">Continue with Google Workspace</span>
</button>
<!-- Verification / Metadata Micro-Footer -->
<div class="pt-2 flex flex-col items-center space-y-2">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-badge text-label-badge">
<span class="material-symbols-outlined text-[13px] text-secondary">verified_user</span>
<span>End-to-End Encrypted Prompt Sync</span>
</div>
<p class="font-label-badge text-label-badge text-outline text-center tracking-normal">
        Single Creator Workspace • Google Gemini Video Engine v2.5
      </p>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit() {
    const btn = document.getElementById('submitBtn');
    if (!btn) return;
    btn.classList.add('opacity-80', 'pointer-events-none');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Authenticating...</span>';
    
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Authenticated</span>';
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove('opacity-80', 'pointer-events-none');
      }, 1200);
    }, 1000);
  }
</script></main></body></html>
