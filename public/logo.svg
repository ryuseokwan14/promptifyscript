<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Neon Brand Gradient -->
    <linearGradient id="neonBrandTrans" x1="100" y1="80" x2="412" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="48%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Glassmorphic Body Gradient -->
    <linearGradient id="glassBodyTrans" x1="160" y1="90" x2="352" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E2F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12121A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Inner Screen Gradient -->
    <linearGradient id="innerScreenTrans" x1="180" y1="120" x2="332" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0E14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Crisp Element Glow Filter -->
    <filter id="neonGlowTrans" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="intenseGlowTrans" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backlight Aura (Transparent fade) -->
  <ellipse cx="256" cy="256" rx="130" ry="150" fill="url(#neonBrandTrans)" opacity="0.35" filter="url(#intenseGlowTrans)"/>

  <!-- Outer 9:16 Smartphone Bezel Frame with Neon Border -->
  <rect x="148" y="76" width="216" height="360" rx="44" fill="url(#glassBodyTrans)" stroke="url(#neonBrandTrans)" stroke-width="7" filter="url(#neonGlowTrans)"/>
  
  <!-- Subtle Glass Inner Stroke / Specular Highlight -->
  <rect x="153" y="81" width="206" height="350" rx="39" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Speaker Grill / Dynamic Island Notch -->
  <rect x="226" y="94" width="60" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>

  <!-- Inner Display Screen Area -->
  <rect x="168" y="118" width="176" height="286" rx="28" fill="url(#innerScreenTrans)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Terminal / Code Prompt Header Dots -->
  <circle cx="196" cy="144" r="4.5" fill="#F43F5E" opacity="0.9"/>
  <circle cx="212" cy="144" r="4.5" fill="#FBBF24" opacity="0.9"/>
  <circle cx="228" cy="144" r="4.5" fill="#10B981" opacity="0.9"/>

  <!-- AI Prompt Symbol: Chevron Cursor '>_' -->
  <!-- '>' prompt angle in Cyber Cyan -->
  <path d="M204 226 L244 256 L204 286" stroke="#06B6D4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowTrans)"/>
  
  <!-- '_' blinking prompt cursor in Neon Rose/Pink -->
  <line x1="262" y1="286" x2="304" y2="286" stroke="#F43F5E" stroke-width="11" stroke-linecap="round" filter="url(#neonGlowTrans)"/>

  <!-- Luminous Cosmic Sparkle Star (✦) in upper right of screen -->
  <g filter="url(#intenseGlowTrans)">
    <path d="M304 164 C304 179 315 190 330 190 C315 190 304 201 304 216 C304 201 293 190 278 190 C293 190 304 179 304 164 Z" fill="#818CF8"/>
    <circle cx="304" cy="190" r="3.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Secondary micro sparkle -->
  <g opacity="0.8" filter="url(#neonGlowTrans)">
    <path d="M194 340 C194 348 200 354 208 354 C200 354 194 360 194 368 C194 360 188 354 180 354 C188 354 194 348 194 340 Z" fill="#06B6D4"/>
  </g>

  <!-- Bottom Home Indicator Bar -->
  <rect x="216" y="388" width="80" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
</svg>
